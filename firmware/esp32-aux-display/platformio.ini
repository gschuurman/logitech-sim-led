; Foundation stub for the ESP32-based auxiliary telemetry display.
; This is NOT finished firmware -- it establishes the serial link and
; parses the JSON frames sld-service's aux-display output sends (see
; docs/aux-display-protocol.md), so a real display driver (TFT_eSPI, U8g2,
; LVGL, ...) can be layered on top once hardware is picked.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
