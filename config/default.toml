# logitech-sim-led default configuration
#
# Copy this file, tweak it, and point the service at your copy (or edit
# this one directly during development). Every section is optional --
# omit a source/output entirely (or set enabled = false) to disable it.

bus_capacity = 256

[sources.forza]
# Point Forza's in-game Settings > HUD and Gameplay > Data Out at
# <this machine's IP>:5300 (use 127.0.0.1 if the game runs on the same PC).
bind_addr = "0.0.0.0:5300"

[outputs.logitech_led]
enabled = true
# Fraction of rpm_max (redline) at which the first shift-light LED turns
# on. 0.6 means the first LED lights at 60% of redline.
shift_point_pct = 0.6
# Fraction of rpm_max at which all 5 LEDs are lit; the bar stays solidly
# full from here up to blink_pct (0.8 leaves the top 20% of the rev range
# fully lit, not still ramping).
full_bar_pct = 0.8
# Fraction of rpm_max at which the solid full bar starts flashing instead,
# like hitting a rev limiter -- a deadzone just below redline rather than
# only exactly at/above it.
blink_pct = 0.97
blink_at_redline = true
