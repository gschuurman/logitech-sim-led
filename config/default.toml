# logitech-sim-led default configuration
#
# Copy this file, tweak it, and point the service at your copy (or edit
# this one directly during development). Every section is optional --
# omit a source/output entirely (or set enabled = false) to disable it.

bus_capacity = 256

[sources.forza]
# Point Forza's in-game Settings > HUD and Gameplay > Data Out at
# <this machine's IP>:5300 (use 127.0.0.1 if the game runs on the same PC).
bind_addr = "0.0.0.0:5300"

[outputs.logitech_led]
enabled = true
# Fraction of the RPM range (idle -> max) at which the first shift-light
# LED turns on. 0.85 means LEDs start lighting at 85% of the way to redline.
shift_point_pct = 0.85
blink_at_redline = true
