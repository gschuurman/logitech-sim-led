name: Release

# Tag a commit with e.g. `v0.1.0` and push the tag to trigger this:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Only the two real binaries -- sld-service and sld-cli. Builds with
      # default features (web UI on, tray off -- see docs/architecture.md).
      - name: Build release binaries
        run: cargo build --release --workspace --target ${{ matrix.target }} -p sld-service -p sld-cli

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/${{ matrix.target }}/release"
          out="logitech-sim-led-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$out"
          cp "$bin_dir/sld-service" "$bin_dir/sld-cli" "$out/"
          cp -r config "$out/config"
          cp README.md LICENSE "$out/"
          cp -r docs "$out/docs"
          tar -czf "${out}.tar.gz" "$out"
          echo "ASSET_PATH=${out}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/${{ matrix.target }}/release"
          out="logitech-sim-led-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$out"
          cp "$bin_dir/sld-service.exe" "$bin_dir/sld-cli.exe" "$out/"
          cp -r config "$out/config"
          cp README.md LICENSE "$out/"
          cp -r docs "$out/docs"
          7z a "${out}.zip" "$out" > /dev/null
          echo "ASSET_PATH=${out}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: logitech-sim-led-${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  # Native installers, one job per OS since each uses that OS's own
  # packaging tool. These build their own binaries independently of the
  # `build` job above (simpler than juggling cross-job artifact paths, and
  # this workflow only runs on a tag push, so the extra build time is
  # cheap). See packaging/<os>/ and docs/installers.md for what each one
  # actually does and how to uninstall.
  package-windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: msi-x86_64-pc-windows-msvc
      - name: Build release binaries
        run: cargo build --release --workspace -p sld-service -p sld-cli
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build MSI
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $out = "logitech-sim-led-${{ github.ref_name }}-x86_64-pc-windows-msvc.msi"
          wix build packaging/windows/product.wxs `
            -arch x64 `
            -d Version=$version `
            -d SourceDir=target/release `
            -d RepoRoot=. `
            -o $out
          echo "MSI_PATH=$out" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: logitech-sim-led-installer-windows
          path: ${{ env.MSI_PATH }}
          if-no-files-found: error

  package-macos-pkg:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: pkg-${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --release --workspace -p sld-service -p sld-cli --target ${{ matrix.target }}
      - name: Assemble package root
        run: |
          set -euo pipefail
          root="pkgroot"
          mkdir -p "$root/usr/local/bin" "$root/usr/local/etc/logitech-sim-led" "$root/usr/local/share/logitech-sim-led"
          cp "target/${{ matrix.target }}/release/sld-service" "$root/usr/local/bin/"
          cp "target/${{ matrix.target }}/release/sld-cli" "$root/usr/local/bin/"
          chmod +x "$root/usr/local/bin/sld-service" "$root/usr/local/bin/sld-cli"
          cp config/default.toml "$root/usr/local/etc/logitech-sim-led/"
          cp packaging/macos/scripts/uninstall.sh "$root/usr/local/share/logitech-sim-led/uninstall.sh"
          chmod +x "$root/usr/local/share/logitech-sim-led/uninstall.sh"
      - name: Build pkg
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="logitech-sim-led-${GITHUB_REF_NAME}-${{ matrix.target }}.pkg"
          pkgbuild --root pkgroot \
            --identifier com.gschuurman.logitech-sim-led \
            --version "$version" \
            --install-location / \
            "$out"
          echo "PKG_PATH=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: logitech-sim-led-installer-macos-${{ matrix.target }}
          path: ${{ env.PKG_PATH }}
          if-no-files-found: error

  package-linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: deb-x86_64-unknown-linux-gnu
      - name: Build release binaries
        run: cargo build --release --workspace -p sld-service -p sld-cli
      - name: Assemble package root
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="debroot"
          mkdir -p "$root/DEBIAN" "$root/usr/bin" "$root/etc/logitech-sim-led" "$root/usr/share/doc/logitech-sim-led"
          cp target/release/sld-service target/release/sld-cli "$root/usr/bin/"
          chmod 755 "$root/usr/bin/sld-service" "$root/usr/bin/sld-cli"
          cp config/default.toml "$root/etc/logitech-sim-led/"
          cp README.md LICENSE "$root/usr/share/doc/logitech-sim-led/"
          # Checkout permissions on doc/config files aren't meaningful;
          # dpkg-deb packages whatever's on disk, so pin them explicitly.
          chmod 644 "$root/etc/logitech-sim-led/default.toml" \
            "$root/usr/share/doc/logitech-sim-led/README.md" \
            "$root/usr/share/doc/logitech-sim-led/LICENSE"
          sed "s/@VERSION@/$version/" packaging/linux/control.template > "$root/DEBIAN/control"
      - name: Build deb
        run: |
          set -euo pipefail
          out="logitech-sim-led-${GITHUB_REF_NAME}-amd64.deb"
          dpkg-deb --build --root-owner-group debroot "$out"
          echo "DEB_PATH=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: logitech-sim-led-installer-linux
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

  # SteamOS (and any other Flatpak-capable Linux desktop). SteamOS's root
  # filesystem is read-only and reset on every OS update, so the .deb above
  # doesn't apply there even though it's also Linux -- see the manifest's
  # own comments and docs/installers.md for why Flatpak is the right target.
  # This one is meaningfully heavier than the others: it builds the Rust
  # binaries genuinely from source *inside* the Flatpak sandbox (against
  # the runtime's own glibc, which is the idiomatic way to do this) rather
  # than reusing binaries built elsewhere, and has to download the
  # freedesktop Platform/Sdk runtimes plus the Rust SDK extension first.
  package-steamos-flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install Flatpak runtime and SDK
        run: |
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08
      - name: Build Flatpak
        run: |
          set -euo pipefail
          flatpak-builder --force-clean --repo=repo builddir \
            packaging/flatpak/io.github.gschuurman.logitech_sim_led.yml
          out="logitech-sim-led-${GITHUB_REF_NAME}-x86_64.flatpak"
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo "$out" io.github.gschuurman.logitech_sim_led
          echo "FLATPAK_PATH=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: logitech-sim-led-installer-steamos
          path: ${{ env.FLATPAK_PATH }}
          if-no-files-found: error

  publish-release:
    needs: [build, package-windows-msi, package-macos-pkg, package-linux-deb, package-steamos-flatpak]
    # The native installer jobs are newer and less battle-tested than
    # `build` (which just tars/zips the binaries) -- if one of them fails,
    # that shouldn't block publishing the release with whatever *did*
    # succeed. `if: always()` runs this even when a dependency failed;
    # gating on `build` specifically (not the installer jobs) means a
    # genuinely broken build still stops the release, but a broken .msi
    # doesn't take the .tar.gz/.zip down with it. download-artifact only
    # pulls artifacts that were actually uploaded, so a failed packaging
    # job just means its installer is missing from this release, not an
    # error here.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
