[package]
name = "sld-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sld-service"
path = "src/main.rs"

[features]
# `web` (the axum server behind the dashboard) and `gui` (native window +
# tray, replacing the bare console app) are both on by default -- this is
# meant to run as a normal desktop app, not a headless service. Build with
# `--no-default-features --features web` for the old console/service-
# manager-friendly behavior (e.g. running under systemd, where a window
# and tray icon make no sense).
default = ["web", "gui"]
web = ["dep:axum"]
gui = [
    "dep:tray-icon",
    "dep:tao",
    "dep:wry",
    "dep:rfd",
    "dep:image",
    "dep:tracing-appender",
    "dep:dirs",
]

[dependencies]
sld-core = { path = "../sld-core" }
sld-source-forza = { path = "../sld-sources/forza" }
sld-output-logitech-hid = { path = "../sld-outputs/logitech-hid" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { version = "0.8", features = ["ws"], optional = true }
tray-icon = { version = "0.19", optional = true }
tao = { version = "0.30", optional = true }
wry = { version = "0.47", optional = true, default-features = false, features = [
    "os-webview",
] }
rfd = { version = "0.15", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
] }
tracing-appender = { version = "0.2", optional = true }
dirs = { version = "5", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[build-dependencies]
winresource = "0.1"
