<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>logitech-sim-led</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 2rem; }
  h1 { font-size: 1.1rem; color: #888; font-weight: normal; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; max-width: 800px; }
  .tile { background: #1c1c1c; border-radius: 8px; padding: 1rem; }
  .tile .label { font-size: 0.75rem; color: #888; text-transform: uppercase; }
  .tile .value { font-size: 1.8rem; margin-top: 0.25rem; }
  #status { color: #888; font-size: 0.8rem; margin-bottom: 1rem; }
</style>
</head>
<body>
<h1>logitech-sim-led -- live telemetry</h1>
<div id="status">connecting...</div>
<div class="grid">
  <div class="tile"><div class="label">Source</div><div class="value" id="source">-</div></div>
  <div class="tile"><div class="label">RPM</div><div class="value" id="rpm">-</div></div>
  <div class="tile"><div class="label">Speed (km/h)</div><div class="value" id="speed">-</div></div>
  <div class="tile"><div class="label">Gear</div><div class="value" id="gear">-</div></div>
</div>
<script>
  const status = document.getElementById('status');
  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => status.textContent = 'connected';
    ws.onclose = () => { status.textContent = 'disconnected, retrying...'; setTimeout(connect, 1000); };
    ws.onerror = () => ws.close();
    ws.onmessage = (evt) => {
      const f = JSON.parse(evt.data);
      document.getElementById('source').textContent = f.game || f.source || '-';
      document.getElementById('rpm').textContent = Math.round(f.rpm) + ' / ' + Math.round(f.rpm_max);
      document.getElementById('speed').textContent = (f.speed_mps * 3.6).toFixed(0);
      document.getElementById('gear').textContent = f.gear;
    };
  }
  connect();
</script>
</body>
</html>
